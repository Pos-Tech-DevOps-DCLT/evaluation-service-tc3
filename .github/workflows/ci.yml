name: CI — evaluation-service

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:

  build-and-test:
    name: "1 · Build & Testes Unitários"
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
      - run: go mod download
      - name: Instalar go-junit-report e gocyclo
        run: |
          go install github.com/jstemmer/go-junit-report/v2@latest
          go install github.com/fzipp/gocyclo/cmd/gocyclo@latest
      - name: Executar testes com cobertura
        run: |
          go test ./... -v -coverprofile=coverage.out -covermode=atomic 2>&1 | tee test-output.txt
          go tool cover -func=coverage.out
          cat test-output.txt | go-junit-report -set-exit-code > test-results.xml || true
      - name: Publicar resultados dos testes
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: test-results.xml
      - name: Complexidade ciclomática (gocyclo)
        if: always()
        run: gocyclo -over 5 . || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-test-reports
          path: |
            test-results.xml
            coverage.out
          retention-days: 30

  lint:
    name: "2 · Lint / Análise Estática"
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
      - name: Instalar golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.57.2
      - name: Executar golangci-lint e publicar no Job Summary
        run: |
          echo "## 🔍 Lint — golangci-lint" >> $GITHUB_STEP_SUMMARY
          OUTPUT=$(golangci-lint run ./... --out-format line-number 2>&1) || true
          COUNT=$(echo "$OUTPUT" | grep -c "^" || echo "0")
          if [ -z "$OUTPUT" ]; then
            echo "✅ Nenhum problema encontrado." >> $GITHUB_STEP_SUMMARY
          else
            echo "> ⚠️ **$COUNT problema(s) encontrado(s)** — não bloqueia a pipeline." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            echo "$OUTPUT" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi
          echo "$OUTPUT"

  docker-build:
    name: "3 · Docker Build"
    runs-on: ubuntu-latest
    needs: [build-and-test, lint]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: evaluation-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=/tmp/evaluation-service.tar
      - uses: actions/upload-artifact@v4
        with:
          name: eval-docker-image
          path: /tmp/evaluation-service.tar
          retention-days: 1

  trivy-scan:
    name: "4 · Scan de Vulnerabilidades (Trivy)"
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: eval-docker-image
          path: /tmp
      - run: docker load --input /tmp/evaluation-service.tar
      - name: Trivy — scan e publicar no Job Summary
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: evaluation-service:${{ github.sha }}
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH,MEDIUM
      - name: Trivy — salvar relatório JSON
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: evaluation-service:${{ github.sha }}
          format: json
          output: trivy-report.json
          exit-code: 0
          severity: CRITICAL,HIGH,MEDIUM
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-trivy-report
          path: trivy-report.json
          retention-days: 30

  push-ecr:
    name: "5 · Push para AWS ECR"
    runs-on: ubuntu-latest
    needs: trivy-scan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - uses: actions/download-artifact@v4
        with:
          name: eval-docker-image
          path: /tmp
      - run: docker load --input /tmp/evaluation-service.tar
      - name: Tag e push para ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: tech-challenge-prod/evaluation-service
          IMAGE_TAG: ${{ github.sha }}
        run: |
          SHORT_SHA=$(echo $IMAGE_TAG | cut -c1-7)
          docker tag evaluation-service:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:$SHORT_SHA
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$SHORT_SHA
          echo "✅ Imagem publicada: $ECR_REGISTRY/$ECR_REPOSITORY:$SHORT_SHA" >> $GITHUB_STEP_SUMMARY